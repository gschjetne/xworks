# Fuzz targets (CLAUDE.md, rule 8), in a workspace of their own: libfuzzer-sys
# brings a license (NCSA, for libFuzzer) that deny.toml doesn't list, and the
# targets aren't part of the product. Run one with a nightly toolchain and
# cargo-fuzz, from here:
#
#   cargo +nightly fuzz run font_file
[package]
name = "xworks-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
app = { path = "../crates/app" }
chrome = { path = "../crates/chrome" }
doc = { path = "../crates/doc" }
libfuzzer-sys = "0.4.12"  # cargo-fuzz's harness
locale = { path = "../crates/locale" }
ron = "0.12.2"
scene = { path = "../crates/scene" }
store = { path = "../crates/store" }
story = { path = "../crates/story" }
testkit = { path = "../crates/testkit" }
text = { path = "../crates/text" }

[[bin]]
name = "font_file"
path = "fuzz_targets/font_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hyphenation_patterns"
path = "fuzz_targets/hyphenation_patterns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paragraph"
path = "fuzz_targets/paragraph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_file"
path = "fuzz_targets/store_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picture_png"
path = "fuzz_targets/picture_png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picture_jpeg"
path = "fuzz_targets/picture_jpeg.rs"
test = false
