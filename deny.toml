# cargo-deny configuration: `cargo deny check` must pass for every change.
# See https://embarkstudios.github.io/cargo-deny/ for the format.

[graph]
all-features = true

[advisories]
# Security advisories and unmaintained crates from the RustSec database.
yanked = "deny"
# Advisories that don't apply or can't be fixed yet, each with its reason.
ignore = [
    # ttf-parser is unmaintained, not vulnerable. It comes only through
    # lopdf, which render-pdf's tests use to read back PDFs we wrote; no
    # shipped code depends on it.
    { id = "RUSTSEC-2026-0192", reason = "test-only, via lopdf; unmaintained, not vulnerable" },
    # zbus_names, zvariant and zvariant_derive are unmaintained, not
    # vulnerable: they were
    # merged into zbus 6. AccessKit's Linux adapter, which carries the
    # accessibility tree to screen readers over D-Bus, still uses zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "via accesskit_unix's zbus 5; merged into zbus 6, unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0371", reason = "via accesskit_unix's zbus 5; merged into zbus 6, unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0372", reason = "via accesskit_unix's zbus 5; merged into zbus 6, unmaintained, not vulnerable" },
]

[licenses]
# xWorks is MIT OR Apache-2.0 (docs/ARCHITECTURE.md, section 11). Only
# permissive licenses are allowed in the dependency graph; copyleft
# licenses (GPL, LGPL, AGPL, MPL, ...) are not. Adding a license here needs
# the project owner's approval.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The Boost license: clipboard-win and error-code, through which every
    # Rust crate reaches the Windows clipboard (project owner, 2026-10-22,
    # review yzmxnt0g).
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Archived in July 2026; text shaping uses HarfRust
    # (docs/ARCHITECTURE.md, section 9).
    { crate = "rustybuzz", reason = "archived; use harfrust" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
