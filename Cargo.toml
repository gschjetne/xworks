[workspace]
resolver = "3"
members = ["crates/*", "shells/*", "tools/*"]
# Prototypes are standalone projects that measure a choice before it is made.
exclude = ["prototypes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gschjetne/xworks"
publish = false

[workspace.dependencies]
# Our crates.
app = { path = "crates/app" }
calc = { path = "crates/calc" }
canvas = { path = "crates/canvas" }
chrome = { path = "crates/chrome" }
doc = { path = "crates/doc" }
locale = { path = "crates/locale" }
render-cpu = { path = "crates/render-cpu" }
render-gpu = { path = "crates/render-gpu" }
render-pdf = { path = "crates/render-pdf" }
scene = { path = "crates/scene" }
store = { path = "crates/store" }
story = { path = "crates/story" }
testkit = { path = "crates/testkit" }
text = { path = "crates/text" }
toolkit = { path = "crates/toolkit" }
shot = { path = "tools/shot" }

# External crates. Each one needs a stated reason (CLAUDE.md, rule 5).
accesskit = "0.25.1"    # the shell's accessibility tree, for screen readers
accesskit_winit = "0.34.1"  # carries the accessibility tree to the platform through winit
anyhow = "1.0.104"      # error handling in tools only
arboard = { version = "3.7.0", default-features = false }  # the system clipboard in the generic shell, as plain text (review yzmxnt0g); its default image support would bring the image crate
fearless_simd = { version = "0.7.0", default-features = false, features = ["force_support_fallback"] }  # vello_cpu's SIMD levels; this feature gives the portable scalar one, whose pixels are the same everywhere
glifo = { version = "=0.4.0", default-features = false }  # the glyph type vello_gpu draws, which it doesn't re-export; already in the build through it
harfrust = "0.14.0"     # shaping text (docs/ARCHITECTURE.md, section 9); it shares read-fonts with skrifa
kurbo = "0.13.1"        # the toolkit's icons: Lucide's SVG paths read, and their strokes turned into fills; already in the build through vello
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }  # PDF output (docs/ARCHITECTURE.md, section 10): fonts embedded and subset, text kept extractable; its default features would bring rustybuzz. raster-images is what lets it write images at all, and brings png, zune-jpeg, gif, image-webp and imagesize, which it uses only for files it's given whole, which we don't
icu_locale_core = "2.3.0"   # language tags
icu_properties = { version = "2.3.0", features = ["unicode_bidi"] }  # Unicode character properties: script, bidi class and its data for unicode-bidi
icu_segmenter = "2.3.0"     # line, word and grapheme boundaries (docs/ARCHITECTURE.md, section 9)
lopdf = { version = "0.42.0", default-features = false }  # reading PDFs back in tests: fonts, pages
pdf-extract = "=0.12.1" # reading PDFs' text back in tests
png = "0.18.1"          # writing test renders as PNG, and reading PNG pictures (docs/ARCHITECTURE.md, section 10)
zune-jpeg = "0.5.15"    # reading JPEG pictures (review pysc65hp); already in the build through krilla's raster-images
gif = "0.14.2"          # reading GIF pictures' first frames (review pysc65hp); already in the build through krilla's raster-images
image-webp = "0.2.4"    # reading WebP pictures (review pysc65hp); already in the build through krilla's raster-images
moxcms = { version = "0.8.1", default-features = false, features = ["lut"] }  # pictures' colour converted to sRGB from their ICC profiles (review pysc65hp); pure Rust, and without its SIMD paths every machine converts alike
pollster = "=0.4.0"     # waits for wgpu's device to open; wgpu's setup is async, and we have no runtime (CLAUDE.md, rule 3)
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }  # the .xw file's compact binary encoding of operations and snapshots (review dfx97ttt); its wire format is specified and stable
proptest = "1.11.0"     # property tests (docs/ARCHITECTURE.md, section 13)
rayon = "1.12.0"        # the app's worker pool (docs/ARCHITECTURE.md, section 8): paragraphs laid out on every core
ron = "0.12.2"          # specs and golden records are RON data
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }  # the .xw file is an SQLite database (docs/ARCHITECTURE.md, section 6); bundled, so every platform has the same SQLite
sha2 = { version = "0.11.0", default-features = false }  # golden images are recorded as SHA-256 hashes of their pixels
skrifa = "0.48.0"       # reading fonts: tables, metrics, character maps and outlines (docs/ARCHITECTURE.md, section 9)
thiserror = "2.0.21"    # error types in libraries
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }  # the CPU renderer (D7, docs/ARCHITECTURE.md, section 10); single-threaded, so render-cpu stays pure
winit = "0.30.13"       # the generic shell's windows and input (docs/ARCHITECTURE.md, section 8)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }  # fetch-fonts takes fonts that come only in zip archives, such as Inter's static faces, out of them; deflate only, which flate2 already in the build reads
vello_gpu = "=0.3.0"    # the GPU renderer (D7, docs/ARCHITECTURE.md, section 10), vello_cpu's twin
wgpu = "=30.0.1"        # the GPU, for vello_gpu and the shells' windows
unicode-bidi = { version = "0.3.18", default-features = false, features = ["std"] }  # the bidi algorithm, run on ICU4X's data

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = "line-tables-only"

# Dependencies are optimized in debug builds too, so tests and debug runs
# of layout and rendering aren't many times slower than release.
[profile.dev.package."*"]
opt-level = 2
