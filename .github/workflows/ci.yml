# Public checks. Every change must pass these (CLAUDE.md, "Checks").
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debug information makes test binaries large and fills the
  # runners' disks; line tables still give backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Clippy and the tests on every desktop platform the generic shell runs
  # on (docs/ROADMAP.md, M1).
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The bundled fonts (spec/text/fonts.ron), which text's tests lay out
      # with, and the hyphenation patterns (spec/text/hyphenation.ron).
      # They're fetched and checked against their hashes, and cached until
      # the lists change.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            fonts
            hyphenation
          key: fonts-${{ hashFiles('spec/text/fonts.ron', 'spec/text/hyphenation.ron') }}
      - run: cargo run -p fetch-fonts
      - run: cargo nextest run --workspace
      # Every scene's hash, approved or not, so a render can be seen to be
      # the same on every platform before a person approves it.
      - run: cargo run -p shot -- --hashes

  # Formatting, dependencies' licenses and advisories, and the pure crates
  # built for WebAssembly, once.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo deny check
      # The pure crates are those under crates/ without a clippy.toml of
      # their own (CLAUDE.md, "Pure crates"). Building them for WebAssembly
      # keeps platform code and C libraries out of them.
      - name: Build the pure crates for WebAssembly
        shell: bash
        run: |
          pkgs=()
          for d in crates/*/; do
            [ -f "$d/clippy.toml" ] || pkgs+=(-p "$(basename "$d")")
          done
          cargo build --target wasm32-unknown-unknown "${pkgs[@]}"
      # calc's decimal numbers against decimal128's test cases (Mike
      # Cowlishaw, IBM). Their license is unclear, so they're fetched, not
      # committed (CLAUDE.md, rule 10), and pinned by hash.
      - name: Fetch the decimal test cases
        run: |
          mkdir -p target/dectest
          curl -fsSL -o target/dectest/dectest.zip https://speleotrove.com/decimal/dectest.zip
          echo "b70a224cd52e82b7a8150aedac5efa2d0cb3941696fd829bdbe674f9f65c3926  target/dectest/dectest.zip" | sha256sum -c -
          unzip -oq target/dectest/dectest.zip -d target/dectest
      - run: cargo nextest run -p calc --test dectest --run-ignored only
        env:
          XWORKS_DECTEST: ${{ github.workspace }}/target/dectest
